[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jam"
version = "1.0.0"
description = "JAM: Joint World-Action Modeling"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.5",
    "diffusers>=0.39",
    "transformers>=4.51",
    "safetensors>=0.5",
    "accelerate>=1",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
