# JAM defaults. Pass the video backbone with --backbone and set train.steps for the run.
model:
  clean_frames: 1
  gradient_checkpointing: true
  agent:
    action_dim: 80
    state_dim: 80
    chunk: 32
    width: 1024
    layers: 30
    ffn_mult: 4
    consequence_dim: 144        # Motion Tracks: 48 points x (dx, dy, visibility)
    consequence_steps: 16
    zero_init_heads: true
  coupling:
    visibility: reciprocal      # reciprocal | world_to_action | action_to_world | decoupled
objective:
  lambda_world: 1.0
  lambda_action: 1.0
  lambda_consequence: 1.0
  world_shift: 5.0
  action_shift: 5.0
  weighting: bell
optim:
  lr: 5.0e-5
  lr_agent: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 1500
  schedule: wsd
  decay_steps: 6000
  min_lr_ratio: 0.05
train:
  grad_accum: 2
  seed: 0
  bf16: true
  fsdp_strategy: hybrid
  log_every: 50
  save_every: 1000
  keep_last: 2
sampler:
  steps: 10
  mode: joint
